<div class="chat-container">
    <div class="chat-messages">
        <div *ngFor="let message of displayMessages" class="message" [ngClass]="message.role">
            <!-- Messaggio utente (nuvoletta a destra) -->
            <div *ngIf="message.role === 'user'" class="bubble user">
                {{ message.content }}
                <div *ngIf="message.images && message.images.length > 0" class="image-previews user-images">
                    <img
                            *ngFor="let img of message.images"
                            [src]="img"
                            alt="Anteprima immagine"
                            class="image-preview"
                            (click)="openImageModal(img)"
                    />
                </div>
            </div>
            <!-- Messaggio assistente (testo a tutta larghezza) -->
            <div *ngIf="message.role === 'assistant'" class="assistant-message">
                <markdown *ngIf="message.content" [data]="message.content"></markdown>
            </div>
        </div>
        <div *ngIf="loading" class="loading-spinner">
            <div class="spinner"></div>
        </div>
    </div>

    <!-- Anteprime delle immagini selezionate -->
    <div class="image-previews" *ngIf="imagesPreview.length > 0">
        <div class="image-preview-wrapper" *ngFor="let preview of imagesPreview; index as i">
            <img [src]="preview" alt="Anteprima immagine" class="image-preview" />
            <div class="remove-icon" (click)="removeImage(i)">&#10006;</div>
        </div>
    </div>

    <div class="chat-input">
        <div class="input-bar">
            <button class="icon-button attach-button" (click)="fileInput.click()">
                <i class="fa fa-paperclip"></i>
            </button>
            <input #fileInput type="file" multiple (change)="handleImageUpload($event)" accept="image/*" />
            <textarea [(ngModel)]="userInput" placeholder="Scrivi un messaggio..." class="input-text"></textarea>
            <button class="icon-button send-button" (click)="sendMessage()" [disabled]="loading || (!userInput.trim() && imagesPreview.length === 0)">
                <i class="fa fa-paper-plane"></i>
            </button>
        </div>
    </div>


    <!-- Modale immagine -->
    <div class="modal" *ngIf="selectedImage" (click)="closeImageModal()">
        <img [src]="selectedImage" alt="Immagine originale" class="modal-image" />
    </div>
</div>
