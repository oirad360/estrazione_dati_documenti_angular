<div class="chat-container">
    <header class="chat-header">
        <h2>Estrazione Dati Documenti</h2>
    </header>
    <div class="chat-messages" #chatMessages (scroll)="checkScrollPosition()">
        <div *ngFor="let message of displayMessages" class="message" [ngClass]="message.role">
            <!-- Messaggio utente (nuvoletta a destra) -->
            <div *ngIf="message.role === 'user'" class="bubble user">
                {{ message.content }}
                <div *ngIf="message.imagesInput && message.imagesInput.length > 0" class="image-previews">
                    <img
                            *ngFor="let el of message.imagesInput"
                            [src]="el.base64url"
                            alt="Anteprima immagine"
                            class="image-preview"
                            (click)="openImageModal(el.base64url)"
                    />
                </div>
            </div>
            <!-- Messaggio assistente (testo a tutta larghezza) -->
            <div *ngIf="message.role === 'assistant'" class="assistant-message">
                <markdown *ngIf="message.content" [data]="message.content"></markdown>
            </div>
        </div>
        <div *ngIf="loading" class="loading-spinner">
            <div class="spinner"></div>
        </div>
    </div>

    <!-- Anteprime delle immagini selezionate -->
    <div class="image-previews" *ngIf="imagesInput.length > 0">
        <div class="image-preview-wrapper" *ngFor="let imageInput of imagesInput">
            <img [src]="imageInput.base64url" alt="Anteprima immagine" class="image-preview" />
            <div class="remove-icon" (click)="removeImage(imageInput.filename)">&#10006;</div>
        </div>
    </div>

    <div class="wrapper">
        <div class="chat-input">
            <div class="input-bar">
                <button class="icon-button attach-button" (click)="fileInput.click()">
                    <i class="fa fa-paperclip"></i>
                </button>
                <input #fileInput type="file" multiple (change)="handleImageUpload($event)" accept="image/*" />
                <textarea [(ngModel)]="userInput" placeholder="Scrivi un messaggio..." class="input-text" (keydown)="handleKeyDown($event)"></textarea>
                <button class="icon-button send-button" (click)="sendMessage()" [disabled]="loading || (!userInput.trim() && imagesInput.length === 0)"
                        [class.disabled]="loading || (!userInput.trim() && imagesInput.length === 0)">
                    <i class="fa fa-paper-plane"></i>
                </button>
            </div>
        </div>
        <button class="scroll-to-bottom-btn" [class.show]="showScrollButton && !isAutoScrolling" (click)="scrollToBottom()">
            <i class="fas fa-arrow-down"></i>  <!-- Icona freccia verso il basso -->
        </button>
    </div>


    <!-- Modale immagine -->
    <div class="modal" *ngIf="selectedImage" (click)="closeImageModal()">
        <img [src]="selectedImage" alt="Immagine originale" class="modal-image" />
    </div>
</div>
