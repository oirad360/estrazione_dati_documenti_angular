<div class="chat-container">
    <div class="chat-messages">
        <div *ngFor="let message of displayMessages" class="message">
            <b>{{ message.role }}: </b>
            <span *ngIf="message.content">{{ message.content }}</span>

            <!-- Anteprime delle immagini inviate -->
            <div *ngIf="message.images && message.images.length > 0" class="image-previews">
                <img
                        *ngFor="let img of message.images"
                        [src]="img"
                        alt="Anteprima immagine"
                        class="image-preview"
                        (click)="openImageModal(img)" />
            </div>
        </div>
    </div>

    <!-- Anteprime delle immagini selezionate -->
    <div class="image-previews" *ngIf="imagesPreview.length > 0">
        <div class="image-preview-wrapper" *ngFor="let preview of imagesPreview; index as i">
            <img [src]="preview" alt="Anteprima immagine" class="image-preview" />
            <div class="remove-icon" (click)="removeImage(i)">&#10006;</div>
        </div>
    </div>

    <div class="chat-input">
        <textarea [(ngModel)]="userInput" placeholder="Scrivi un messaggio..."></textarea>
        <input #fileInput type="file" multiple (change)="handleImageUpload($event)" />
        <button [disabled]="loading || (userInput === '' && imagesPreview.length === 0)" (click)="sendMessage()">Invia</button>
    </div>

    <!-- Modale immagine -->
    <div class="modal" *ngIf="selectedImage" (click)="closeImageModal()">
        <img [src]="selectedImage" alt="Immagine originale" class="modal-image" />
    </div>
</div>
